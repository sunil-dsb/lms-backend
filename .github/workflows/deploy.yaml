name: Deploy to AWS

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
  # These two must match the Terraform outputs of the same name.
  DEPLOYMENT_TARGET: ${{ vars.DEPLOYMENT_TARGET || 'lms-backend-production' }}
  SSM_PREFIX: ${{ vars.SSM_PREFIX || '/lms-backend/production' }}
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Check this is still the latest main commit
        id: fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"

          if [[ "$COMMIT_SHA" != "$LATEST_SHA" ]]; then
            echo "Skipping stale CI run: $COMMIT_SHA"
            echo "Current main commit is $LATEST_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # The deploy script and Nginx config come from the commit being deployed.
      - name: Checkout the deployed commit
        if: steps.fresh.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        if: steps.fresh.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image exists
        id: image
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker manifest inspect "${IMAGE_REPO}:sha-${COMMIT_SHA}" >/dev/null
          echo "Verified image: ${IMAGE_REPO}:sha-${COMMIT_SHA}"
          echo "repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through OIDC
        if: steps.fresh.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The host has no GitHub credentials of its own. It pulls the image with
      # this job's token, which stops working when the job ends.
      - name: Hand the registry token to the host
        if: steps.fresh.outputs.deploy == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/deploy/ghcr-token" \
            --type SecureString \
            --value "$GHCR_TOKEN" \
            --overwrite >/dev/null

      - name: Send deployment command and verify its result
        if: steps.fresh.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ steps.image.outputs.repo }}
        shell: bash
        run: |
          set -euo pipefail

          # Recheck main immediately before requesting deployment.
          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$COMMIT_SHA" != "$LATEST_SHA" ]]; then
            echo "Skipping stale commit; main has advanced to $LATEST_SHA"
            exit 0
          fi

          # Ship the deploy scripts and Nginx config inside the command itself,
          # so the host never needs access to the repository.
          BUNDLE="$(tar -czf - scripts/deploy.sh scripts/rollback.sh infra/nginx | base64 -w0)"

          # Use JSON generation instead of manually quoting SSM parameters.
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg bundle "$BUNDLE" \
            --arg image "$IMAGE_REPO" \
            --arg region "$AWS_REGION" \
            --arg prefix "$SSM_PREFIX" '{
            commands: [
              "set -eu",
              "rm -rf /opt/lms-backend/release",
              "mkdir -p /opt/lms-backend/release",
              ("echo " + $bundle + " | base64 -d | tar -xzf - -C /opt/lms-backend/release"),
              ("AWS_DEFAULT_REGION=" + $region + " SSM_PREFIX=" + $prefix + " bash /opt/lms-backend/release/scripts/deploy.sh " + $image + " sha-" + $sha)
            ]
          }' > /tmp/ssm-parameters.json

          RESPONSE="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:DeploymentTarget,Values=${DEPLOYMENT_TARGET}" \
            --comment "Deploy ${COMMIT_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          COMMAND_ID="$RESPONSE"
          echo "SSM command: $COMMAND_ID"

          # A tag-targeted command resolves its instances asynchronously.
          INSTANCE_IDS="[]"
          for _ in {1..12}; do
            INSTANCE_IDS="$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query 'CommandInvocations[].InstanceId' \
              --output json)"
            [[ "$(jq 'length' <<< "$INSTANCE_IDS")" -gt 0 ]] && break
            sleep 5
          done

          COUNT="$(jq 'length' <<< "$INSTANCE_IDS")"
          if [[ "$COUNT" -ne 1 ]]; then
            echo "Expected exactly one SSM target; received: $INSTANCE_IDS" >&2
            exit 1
          fi

          INSTANCE_ID="$(jq -r '.[0]' <<< "$INSTANCE_IDS")"
          echo "Target instance: $INSTANCE_ID"

          DEADLINE=$((SECONDS + 900))
          STATUS="Pending"

          while (( SECONDS < DEADLINE )); do
            if INVOCATION="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null)"; then

              STATUS="$(jq -r '.Status' <<< "$INVOCATION")"

              case "$STATUS" in
                Success)
                  echo "Deployment command succeeded."
                  jq -r '.StandardOutputContent // ""' <<< "$INVOCATION"
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  echo "Deployment failed with status: $STATUS" >&2
                  jq -r '"STDOUT:\n" + (.StandardOutputContent // "") + "\nSTDERR:\n" + (.StandardErrorContent // "")' <<< "$INVOCATION"
                  exit 1
                  ;;
              esac
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command $COMMAND_ID (last status: $STATUS)" >&2
          exit 1

      - name: Clear the registry token
        if: always() && steps.fresh.outputs.deploy == 'true'
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/deploy/ghcr-token" \
            --type SecureString \
            --value "unset" \
            --overwrite >/dev/null || true

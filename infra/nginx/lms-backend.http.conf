# Plain HTTP site. Used until a TLS certificate exists for the API domain.
# scripts/deploy.sh installs this as /etc/nginx/conf.d/lms-backend.conf.
include /etc/nginx/upstreams/lms-backend-upstream.conf;

server {
    listen 80 default_server;
    server_name __SERVER_NAME__;

    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://lms_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
